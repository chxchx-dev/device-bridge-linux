# Project-scoped Codex configuration.
# Loaded only for trusted projects by Codex.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
model = "gpt-5.6-luna"
model_reasoning_effort = "low"

[sandbox_workspace_write]
network_access = false

[mcp_servers.devicebridge]
command = "node"
args = ["services/mcp-server/dist/index.js"]

[mcp_servers.devicebridge.env]
DEVICEBRIDGE_MCP_CAPABILITIES = "system:read,android:read,gaming:read,mode:read,codex:read"
